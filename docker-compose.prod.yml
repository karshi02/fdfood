# Production: host nginx load-balances app (3020) + app2 (3021), no phpMyAdmin,
# MariaDB tuned for a small shared server.
#
# Zero-downtime layout:
#   releases/<git-hash>/   one folder per deploy (the old public/ contents)
#   releases/current       relative symlink to the live release; Apache serves it
# Code deploy = unpack a new release + swap the symlink. No container restarts.
# Image change = recreate app, then app2 (nginx sends traffic to whichever is up).
# The db service is never restarted by a deploy; its data lives in the dbdata volume.
x-app: &app
  build: .
  image: fdfood-app
  volumes:
    - ./releases:/var/www/releases:ro
    - sessions:/var/lib/php/sessions
  environment:
    APACHE_DOCUMENT_ROOT: /var/www/releases/current
    DB_HOST: db
    DB_NAME: fdfood
    DB_USER: fdfood
    DB_PASS: ${DB_PASS}
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
    interval: 10s
    retries: 3
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:3020:80"

  app2:
    <<: *app
    ports:
      - "127.0.0.1:3021:80"

  db:
    # MySQL 8.4 needs an x86-64-v2 CPU; the production box doesn't have one
    image: mariadb:11.4
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=64M --performance-schema=OFF --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: fdfood
      MYSQL_USER: fdfood
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: Asia/Bangkok
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    restart: unless-stopped

volumes:
  dbdata:
  sessions:
